name: Office checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/onlyoffice*.test.js
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - run: python3 scripts/build_wine.py
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: twodrive-office-packages
          path: |
            dist/*.oxt
            dist/*.plugin
            dist/*-wine-x64.zip
            dist/SHA256SUMS
